# frostmarks' system user (docs/specs/lodge-app.md, and lodge's
# docs/specs/app-contract.md, Install layout). The app's user may use lodge's
# inference socket (group lodge-apps), and is never in group lodge.
# Group lodge owns the app socket (SocketGroup=lodge). This file declares the
# group too, so that the socket starts without lodge's own sysext (core
# ADR-0058). The user is never a member of group lodge.
g lodge -
u frostmarks - "frostmarks, the bookmark manager behind lodge" /var/lib/frostmarks
m frostmarks lodge-apps

# User lodge, exactly as lodge's own sysusers.d/lodge.conf declares it, so that
# the daemon resolves it without lodge's sysext. The line must stay identical,
# or systemd-sysusers warns and keeps only the first.
u lodge - "lodge, the tailnet web shell for frostyard's apps" /var/lib/lodge
