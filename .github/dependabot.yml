# Dependabot (frostyard/core ADR-0071 row B13, ADR-0075 and ADR-0089).
# Each ecosystem has 1 entry: the actions the workflows pin, the Go module
# of go.mod, and the web UI's package.json. Each entry has a monthly
# schedule and 1 group with `patterns: ["*"]`, so each ecosystem opens at
# most 1 version-update PR a month. The groups have no `applies-to`, so
# security updates stay immediate, with 1 PR each.
version: 2
updates:
  - package-ecosystem: "github-actions"
    directory: "/"
    schedule:
      interval: "monthly"
    open-pull-requests-limit: 5
    commit-message:
      prefix: "ci"
      include: "scope"
    groups:
      actions:
        patterns: ["*"]

  - package-ecosystem: "gomod"
    directory: "/"
    schedule:
      interval: "monthly"
    open-pull-requests-limit: 5
    commit-message:
      prefix: "build"
      include: "scope"
    groups:
      go:
        patterns: ["*"]

  - package-ecosystem: "npm"
    directory: "/web"
    schedule:
      interval: "monthly"
    open-pull-requests-limit: 5
    commit-message:
      prefix: "build"
      include: "scope"
    groups:
      web:
        patterns: ["*"]
