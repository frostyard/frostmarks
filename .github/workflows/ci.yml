# CI workflow (frostyard/core ADR-0021: SHA-pinned actions, least privilege;
# ADR-0083: make ci is the same gate locally). The job verify is the required
# check and has no name key, so its context stays "verify". Actions use full
# commit SHA pins, the token has only contents read, and checkout does not
# persist credentials.
name: CI

on:
  pull_request: {}
  push:
    branches:
      - main
  merge_group: {}

permissions: {}

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  verify:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    permissions:
      contents: read
    env:
      NODE_VERSION: "24.21.0"
      COREPACK_ENABLE_DOWNLOAD_PROMPT: "0"
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
          fetch-depth: 0
      # Go comes from go.mod's go line (frostyard/core ADR-0043).
      - uses: actions/setup-go@d8cbb8045d7f43706b9177cceb36c1f91a6644d5 # v7.1.0
        with:
          go-version-file: go.mod
          cache: true
      # The tools of make ci come from mise.toml and mise.lock (ADR-0043),
      # checksum-verified, the same way a developer's `mise install` does.
      - uses: jdx/mise-action@924e7c586e33d7d4bae9c14e26c5d22e2beb6e78 # v5.3.0
        with:
          install: true
          install_args: golangci-lint buf protoc-gen-go
          cache: true
      # make ci runs the web UI's checks (make web-check), which a developer
      # runs in the nsl machine; the runner has Node, so IN_NSL runs them here.
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version: ${{ env.NODE_VERSION }}
      # pnpm comes from corepack, pinned with its hash by web/package.json.
      - run: corepack enable
      - run: make ci BASE="$BASE" IN_NSL='sh -c'
        env:
          BASE: ${{ github.event.pull_request.base.sha || github.event.merge_group.base_sha || '' }}

  # A vulnerability database and a module download need the network, so this
  # check is no part of make ci and runs as its own job (ADR-0083).
  vulncheck:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: actions/setup-go@d8cbb8045d7f43706b9177cceb36c1f91a6644d5 # v7.1.0
        with:
          go-version-file: go.mod
          cache: true
      - run: make vulncheck
